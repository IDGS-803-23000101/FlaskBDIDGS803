{% macro datos(name, placeholder, type="text") %}
    <div class="mb-3">
        <label for="{{ name }}" class="form-label">{{ name }}:</label>
        <input type="{{ type }}" class="form-control" id="{{ name }}" name="{{ name }}"
        placeholder="{{ placeholder }}">
    </div>
{% endmacro %}


{% macro campoNuevo(field) %}
    <div class="mb-3">
        <label class="block text-sm font-medium text-body mb-1">{{ field.label }}</label>

        {{ field(**kwargs) | safe }}
        
        {% if field.errors %}
            <ul class="mt-1">
                {% for error in field.errors %}
                    <li class="text-red-500 text-xs italic">{{ error }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>
{% endmacro %}
